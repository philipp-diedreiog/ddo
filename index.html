<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprache wählen / Select Language</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 10px;
      /* Warmer, eleganter Creme/Gelb-Hintergrund passend zur Speisekarte */
      background-color: #f5e4ab; 
    }
    h1 {
      color: #1a2a3a;
      margin-bottom: 25px;
      font-size: 1.6em;
    }
    .headline {
      display: inline-block;
      background: #ffffff;
      /* Edles Weinrot / Bordeaux für den Titelrahmen und Text */
      color: #7a152b; 
      padding: 18px 32px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(122, 21, 43, 0.15);
      border: 3px solid #7a152b;
      margin-bottom: 32px;
      font-size: 2em;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .language-link {
      display: block;
      padding: 18px 10px;
      margin: 12px 0;
      background-color: #ffffff;
      /* Dickerer, gut sichtbarer grüner Rahmen */
      border: 3.5px solid #1c5235; 
      color: #1c5235;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.3em;
      box-shadow: 0 3px 8px rgba(28, 82, 53, 0.12);
      transition: all 0.2s ease;
    }
    .language-link:active {
      background-color: #1c5235;
      color: #ffffff;
    }
    .flag {
      margin-right: 15px;
      font-size: 1.4em;
    }
  </style>
</head>
<body>
  <h1 class="headline">choose your ❤️ language! </h1>

  <!-- Österreichisch & Sprachenübersicht für dieses Jahr -->
  <a href="karte_de_at.pdf" class="language-link"><span class="flag">🇦🇹</span> Österreichisch</a>
  <a href="karte_en.pdf" class="language-link"><span class="flag">🇬🇧</span> English</a>
  <a href="karte_it.pdf" class="language-link"><span class="flag">🇮🇹</span> Italiano</a>
  <a href="karte_es.pdf" class="language-link"><span class="flag">🇪🇸</span> Español</a>
  <a href="karte_fr.pdf" class="language-link"><span class="flag">🇫🇷</span> Français</a>
  <a href="karte_ua.pdf" class="language-link"><span class="flag">🇺🇦</span> Українська (UA)</a>
  <a href="karte_cz.pdf" class="language-link"><span class="flag">🇨🇿</span> Čeština (CZ)</a>
  <a href="karte_sk.pdf" class="language-link"><span class="flag">🇸🇰</span> Slovenčina (SK)</a>
  <a href="karte_sl.pdf" class="language-link"><span class="flag">🇸🇮</span> Slovenščina (SLO)</a>
  <a href="karte_hu.pdf" class="language-link"><span class="flag">🇭🇺</span> Magyar (HU)</a>
  <a href="karte_ar.pdf" class="language-link"><span class="flag">🇦🇪</span> العربية (Arabisch)</a>
  <a href="karte_zh.pdf" class="language-link"><span class="flag">🇨🇳</span> 简体中文 (Chinesisch)</a>
</body>
</html>
